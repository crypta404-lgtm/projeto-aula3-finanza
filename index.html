<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova Transação — Finanza</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ===== Cabeçalho ===== -->
  <header class="topbar">
    <div class="topbar__inner">
      <a href="#" class="brand">
        <span class="brand__logo">F</span>
        <span class="brand__name">Finanza</span>
      </a>

      <nav class="nav" aria-label="Navegação principal">
        <a href="#" class="nav__link">Dashboard</a>
        <a href="#" class="nav__link nav__link--active">Transações</a>
        <a href="#" class="nav__link">Contas</a>
        <a href="#" class="nav__link">Relatórios</a>
        <a href="#" class="nav__link">Metas</a>
      </nav>

      <div class="topbar__actions">
        <button class="icon-btn" type="button" aria-label="Notificações">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
          <span class="icon-btn__dot"></span>
        </button>
        <div class="avatar" title="Minha conta">AD</div>
      </div>
    </div>
  </header>

  <!-- ===== Conteúdo ===== -->
  <main class="page">
    <div class="page__heading">
      <p class="page__eyebrow">Transações</p>
      <h1 class="page__title">Nova Transação</h1>
      <p class="page__subtitle">Registre uma entrada ou saída para manter suas finanças em dia.</p>
    </div>

    <form id="transactionForm" class="card" novalidate>

      <!-- Tipo -->
      <div class="field">
        <label for="tipo" class="field__label">
          <span class="field__icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 17 17 7M17 7H9M17 7v8"/></svg>
          </span>
          Tipo
        </label>
        <div class="field__control select-wrap">
          <select id="tipo" name="tipo" required>
            <option value="" disabled selected>Selecione o tipo</option>
            <option value="entrada">Entrada</option>
            <option value="saida">Saída</option>
          </select>
          <span class="type-badge" id="typeBadge" hidden></span>
        </div>
        <small class="field__error"></small>
      </div>

      <!-- Valor -->
      <div class="field">
        <label for="valor" class="field__label">
          <span class="field__icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
          </span>
          Valor
        </label>
        <div class="field__control input-prefix">
          <span class="input-prefix__text">R$</span>
          <input type="text" id="valor" name="valor" inputmode="numeric" placeholder="0,00" autocomplete="off" required>
        </div>
        <small class="field__error"></small>
      </div>

      <!-- Descrição -->
      <div class="field">
        <label for="descricao" class="field__label">
          <span class="field__icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
          </span>
          Descrição
        </label>
        <div class="field__control">
          <input type="text" id="descricao" name="descricao" maxlength="80" placeholder="Ex.: Almoço com cliente" autocomplete="off" required>
          <span class="char-count" id="charCount">0/80</span>
        </div>
        <small class="field__error"></small>
      </div>

      <!-- Data -->
      <div class="field">
        <label for="data" class="field__label">
          <span class="field__icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
          </span>
          Data
        </label>
        <div class="field__control date-wrap">
          <input type="date" id="data" name="data" required>
          <button type="button" class="date-wrap__btn" id="openCalendar" aria-label="Abrir calendário">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01"/></svg>
          </button>
        </div>
        <small class="field__error"></small>
      </div>

      <!-- Categoria -->
      <div class="field">
        <label for="categoria" class="field__label">
          <span class="field__icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20.59 13.41 13.42 20.58a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82Z"/><path d="M7 7h.01"/></svg>
          </span>
          Categoria
        </label>
        <div class="field__control select-wrap">
          <select id="categoria" name="categoria" required>
            <option value="" disabled selected>Selecione a categoria</option>
            <option value="alimentacao">Alimentação</option>
            <option value="saude">Saúde</option>
            <option value="salario">Salário</option>
            <option value="transporte">Transporte</option>
            <option value="lazer">Lazer</option>
            <option value="moradia">Moradia</option>
          </select>
        </div>
        <small class="field__error"></small>
      </div>

      <!-- Conta -->
      <div class="field">
        <label for="conta" class="field__label">
          <span class="field__icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>
          </span>
          Conta
        </label>
        <div class="field__control select-wrap">
          <select id="conta" name="conta" required>
            <option value="" disabled selected>Selecione a conta</option>
            <option value="conta-corrente">Conta corrente</option>
            <option value="cartao">Cartão</option>
            <option value="dinheiro">Dinheiro</option>
          </select>
        </div>
        <small class="field__error"></small>
      </div>

      <!-- Ações -->
      <div class="actions">
        <button type="button" class="btn btn--ghost" id="cancelBtn">Cancelar</button>
        <button type="submit" class="btn btn--primary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6 9 17l-5-5"/></svg>
          Salvar transação
        </button>
      </div>
    </form>
  </main>

  <!-- Notificação -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="script.js"></script>
</body>
</html>
